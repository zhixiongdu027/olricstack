name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1

  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: olric_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: make build
      - name: race detector
        run: make test-race
      - name: third-party race
        run: make test-third-party-race
      - name: Host e2e (race)
        timeout-minutes: 90
        run: make e2e-host-race
      - name: coverage
        run: make coverage
      - name: host e2e (all)
        env:
          E2E_MYSQL_PORT: '3306'
          E2E_MYSQL_USER: root
          E2E_MYSQL_PASSWORD: test
        run: go test -count=1 -tags e2e -timeout=50m -run 'TestHost' ./internal/e2e/
      - name: kind e2e (all)
        run: E2E_TEST_RUN='TestKind' make e2e-kind
