name: Release

on:
  push:
    tags: ['v*']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          TAG="${{ github.ref_name }}"
          IMAGES="olric-node olric-sidecar watchdog operator"
          for img in $IMAGES; do
            docker buildx build \
              --target "$img" \
              --platform linux/amd64 \
              --push \
              -t "ghcr.io/${{ github.repository }}/${img}:${TAG}" \
              .
          done
