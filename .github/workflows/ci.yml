name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '*.md', '*.png', '*.jpg']
  push:
    branches: [master, main, 'harden-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================== Phase 1: Fast Checks (parallel) =====================

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy check
        run: make tidy-check
      - name: format check
        run: make fmt-check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: make govulncheck
      - name: gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
        continue-on-error: true
      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # ===================== Phase 2: Core Tests =====================

  build-and-test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build all binaries
        run: make build
      - name: unit tests
        run: go test -count=1 -timeout=120s ./cmd/... ./internal/... ./api/...
      - name: upload binaries (for e2e jobs)
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: .build/
          retention-days: 1

  race-and-coverage:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: race detector
        run: make test-race
      - name: coverage
        run: make coverage
      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .build/coverage.out
          retention-days: 7

  third-party:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache third-party Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-third-party-${{ hashFiles('third_party/olric/go.sum') }}
          restore-keys: ${{ runner.os }}-go-third-party-
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: test third-party fork
        run: make test-third-party

  # ===================== Phase 3: E2E Tests =====================

  host-e2e-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: olric_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: .build/
      - run: chmod +x .build/*
      - name: host e2e smoke
        run: go test -count=1 -tags e2e -timeout=20m -run 'TestHostOnly(TwoNodeWriteStorm|TwoNodeClusterJoinsFromWatchdogTopologyOnly|MySQLDurableWritePath|WatchdogDemotionBlocksAndPromotionRestoresWrites)$' ./internal/e2e/
      - name: collect diagnostics on failure
        if: failure()
        run: |
          echo "=== SIDECAR LOGS ===" && cat /tmp/olric-sidecar-*.log 2>/dev/null || true
          echo "=== NODE LOGS ===" && cat /tmp/olric-node-*.log 2>/dev/null || true
          echo "=== E2E DIAGNOSTICS ===" && find /tmp -name 'e2e-diag-*' -exec cat {} \; 2>/dev/null || true

  host-e2e-full:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: olric_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: .build/
      - run: chmod +x .build/*
      - name: all host e2e
        run: go test -count=1 -tags e2e -timeout=50m -run 'TestHost(Only$|DataLifecycleMatrix|DataLifecycleUnderBackgroundTraffic)' ./internal/e2e/

  kind-e2e-smoke:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: .build/
      - run: chmod +x .build/*
      - name: kind e2e smoke
        run: E2E_TEST_RUN='TestKind(StackReconcilesThroughWatchdog|WatchdogFailoverReconnectsOlricNode|MySQLDurableWritePath)$' make e2e-kind

  kind-e2e-full:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: .build/
      - run: chmod +x .build/*
      - name: all kind e2e
        run: E2E_TEST_RUN='TestKind' make e2e-kind

  # ===================== Phase 4: Docker validation =====================

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfile
        timeout-minutes: 15
        run: docker build .
